# =============================================================================
# VyaraHR Nginx Production Reverse Proxy Configuration
# Linux VPS (Ubuntu / Debian) - Hostinger VPS Deployment
# =============================================================================

# Rate limiting zone for API requests
limit_req_zone $binary_remote_addr zone=vyara_api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # For initial Certbot SSL verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is installed)
    # return 301 https://$host$request_uri;

    # Frontend Single Page Application Root
    root /var/www/vyarahr/frontend/dist;
    index index.html;

    # Maximum file upload size for documents and avatars
    client_max_body_size 50M;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Reverse Proxy for Node.js Backend API
    location /api/ {
        limit_req zone=vyara_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:54321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # 2. Reverse Proxy for Storage / Uploads
    location /storage/ {
        proxy_pass http://127.0.0.1:54321/api/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # 4. SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
